name: Android CI

on:
  push:
    branches: [main, migration/**]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Pure-JVM modules (model, domain, network, data, ai) hold the ported iOS test suites.
      - name: Unit tests
        run: ./gradlew test --console=plain
      - name: Debug build
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Regenerate the string catalog from the iOS repo when it is checked out next to this one
        if: false
        run: node scripts/xcstrings-to-json.mjs ../chiara-app-ios/chiara/Localizable.xcstrings
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
